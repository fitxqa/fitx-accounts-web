<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Book a service visit</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>

  main{max-width:520px;margin:0 auto;padding:14px 16px 110px}
  .intro{margin:0 0 12px}.intro h1{font-size:19px;margin:0 0 2px;letter-spacing:-.3px}.intro p{margin:0;color:var(--mu);font-size:14px}

  .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

  .s.p1{background:var(--o);border-color:var(--o);color:#fff}
  .s.p2{background:var(--ink);border-color:var(--ink);color:#fff}
  .slots.prio .s.on{outline:3px solid var(--o);outline-offset:2px;position:relative}
  .slots.prio .s.on:not(.p1):not(.p2){background:#fff;color:var(--ink);border-color:var(--o)}
  .slots.prio .s.on::before{content:"✓";position:absolute;top:-8px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:800}
  .legend{display:none;gap:14px;align-items:center;font-size:12px;color:var(--mu);margin-top:8px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
  .days button.near{position:relative}.days button.near::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--o)}
  .days button.on.near::after{background:#fff}
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--ln);padding:8px max(20px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom))}
  .bar>div{max-width:520px;margin:0 auto}
  .btn{display:block;width:100%;height:48px;border:0;border-radius:14px;background:var(--o);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
  .btn:disabled{background:#f3b98e}
  .sum{font-size:12.5px;color:var(--mu);text-align:center;margin:0 0 6px;min-height:1em}
  .note{font-size:12.5px;color:var(--mu);text-align:center;margin:6px 0 0}
  .err{color:var(--red);font-weight:600;font-size:13px;margin:0 0 8px;display:none;text-align:center}
  .done{text-align:center;padding:40px 10px}.done .big{width:64px;height:64px;border-radius:50%;background:#e3f4ea;color:var(--green);display:grid;place-items:center;font-size:32px;margin:0 auto 14px}.done h2{margin:0 0 8px;font-size:22px}.done p{color:var(--mu);margin:0 0 6px}
  a{color:var(--o);font-weight:600;text-decoration:none}
  .closed{text-align:center;color:var(--mu);padding:30px 4px}
</style>

      <p class="hint">Sat – Thu · ${t12(cfg.from || 9).join(' ')} – ${t12(cfg.to || 22).join(' ')} · about 1 hour</p>` : '<div class="closed">No free times in the next two weeks. Please call or WhatsApp us.</div>'}</div>
    <div class="sec"><h3><i>2</i>Location</h3>
      <button type="button" class="locbtn" id="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Share My Location</span></button>
      <p class="hint" id="near" style="display:none"></p>
      <div style="height:10px"></div>
      <div class="f"><label for="ar">Area</label><select class="in ph" id="ar"><option value="">Select area</option>${Object.entries(AREAS).map(([g, l]) => `<optgroup label="${esc(g)}">${l.slice().sort().map(a => `<option>${esc(a)}</option>`).join('')}</optgroup>`).join('')}<option>Other</option></select></div>
      <div class="row f"><div><label for="bd">Building</label><input class="in" id="bd" inputmode="numeric" maxlength="10"></div><div><label for="st">Street</label><input class="in" id="st" inputmode="numeric" maxlength="10"></div><div><label for="zn">Zone</label><input class="in" id="zn" inputmode="numeric" maxlength="10"></div></div>
</div>
    <div class="sec"><h3><i>3</i>Your details</h3>
      <div class="row2 f"><div><label for="nm">Name</label><input class="in" id="nm" name="name" autocomplete="name" maxlength="60" placeholder="Your name"></div>
      <div><label for="ph">Mobile</label><input class="in" id="ph" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="5555 1234" maxlength="20"></div></div></div>
    <div class="sec"><h3><i>4</i>Machine &amp; problem</h3>
      <div class="row2 f"><div><label for="mc">Machine</label><select class="in ph" id="mc"><option value="">Select</option>${MACHINES.map(x => `<option>${esc(x)}</option>`).join('')}</select></div>
      <div><label for="br">Brand</label><input class="in" id="br" maxlength="40" placeholder="Optional"></div></div>
      <label for="pr">Problem</label><div class="pp"><input class="in" id="pr" maxlength="300" placeholder="What is wrong?"><input type="file" id="ph1" accept="image/*" hidden><button type="button" class="photo" id="phb" title="Add a photo (optional)" aria-label="Add a photo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button></div></div>
    ${co.phone ? `<p class="note">Questions? Call <a href="tel:${esc(co.phone)}">${esc(co.phone)}</a></p>` : ''}
    <div class="bar"><div><p class="err" id="er"></p><p class="sum" id="sum"></p><button type="submit" class="btn" id="go" ${ds.length ? '' : 'disabled'}>Book visit</button></div></div>
    </form>`;
    const f = document.getElementById('f');
    const drawSlots = () => {
      const box = document.getElementById('sl'); if (!box) return;
      if (slot && !freeSlots(day).some(s => s.t === slot)) slot = '';
      const pr = prio(day), anyP = pr.best.length || pr.good.length;
      box.classList.toggle('prio', !!anyP);
      box.innerHTML = allSlots(day).map(s => { const [h, ap] = t12(s.h); return `<button type="button" class="s${s.t === slot ? ' on' : ''}${pr.best.includes(s.t) ? ' p1' : pr.good.includes(s.t) ? ' p2' : ''}" data-t="${s.t}" ${s.busy ? 'disabled title="' + (s.past ? 'Passed' : 'Booked') + '"' : ''}>${rng(s.h)}</button>`; }).join('');
      box.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { slot = b.dataset.t; other = false; const ob = document.getElementById('othBox'); if (ob) { ob.style.display = 'none'; document.getElementById('oth').classList.remove('on'); } drawSlots(); label(); });
      document.querySelectorAll('.days [data-d]').forEach(b => b.classList.toggle('near', nearSlots(b.dataset.d).length > 0));
      const lg = document.getElementById('legend'); if (lg) lg.style.display = anyP ? 'flex' : 'none';
      label();
    };
    const label = () => { const sm = document.getElementById('sum'); if (!sm || !day) return; const d = new Date(day + 'T00:00:00'); sm.textContent = other ? 'Other time – we will contact you' : slot ? d.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'short'}) + ' · ' + rngTxt(+slot.slice(0, 2)) : 'Choose a date and time'; };
    f.querySelectorAll('.days [data-d]').forEach(b => b.onclick = () => { day = b.dataset.d; f.querySelectorAll('.days [data-d]').forEach(x => x.classList.toggle('on', x === b)); drawSlots(); });
    drawSlots();
    document.getElementById('mc').onchange = e => e.target.classList.toggle('ph', !e.target.value);
    const ob = document.getElementById('oth');
    if (ob) ob.onclick = () => { other = !other; ob.classList.toggle('on', other); document.getElementById('othBox').style.display = other ? '' : 'none'; if (other) { slot = ''; drawSlots(); setTimeout(() => document.getElementById('othT').focus(), 50); } label(); };
    document.getElementById('ar').onchange = e => { e.target.classList.toggle('ph', !e.target.value); myArea = e.target.value; showNear(); };
    function showNear() {
      const box = document.getElementById('near'); drawSlots();
      if (!myArea) { box.style.display = 'none'; return; }
      const hit = days().map(iso).map(d => [d, nearSlots(d)]).find(x => x[1].length);
      box.style.display = 'block';
      if (!hit) { box.innerHTML = `📍 <b>${esc(myArea)}</b> – area filled in for you.`; return; }
      const [d, ts] = hit, dl = new Date(d + 'T00:00:00').toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'});
      box.innerHTML = `📍 <b>${esc(myArea)}</b> – our team is already near you on <b>${esc(dl)}</b>. Orange times are best for you.<br><button type="button" id="nearGo">Choose ${esc(dl)} · ${rngTxt(+ts[0].slice(0, 2))}</button>`;
      document.getElementById('nearGo').onclick = () => { day = d; slot = ts[0]; document.querySelectorAll('.days [data-d]').forEach(x => x.classList.toggle('on', x.dataset.d === d)); drawSlots(); label(); document.querySelector('.days').scrollIntoView({behavior: 'smooth', block: 'center'}); };
    }
    document.getElementById('pin').onclick = e => {
      const b = e.currentTarget;
      if (!navigator.geolocation) { b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Location not available</span>'; return; }
      b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Getting Your Location…</span>';
      navigator.geolocation.getCurrentPosition(async p => { const lat = p.coords.latitude, lng = p.coords.longitude; loc = 'https://maps.google.com/?q=' + lat.toFixed(6) + ',' + lng.toFixed(6); b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span>Location Added</span>'; b.classList.add('ok');
        const a = await detectArea(lat, lng);
        const sel = document.getElementById('ar');
        if (a) { sel.value = a; sel.classList.remove('ph'); myArea = a; }
        showNear();
      },
        () => { b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><span>Could not get location – tap to retry</span>'; }, {enableHighAccuracy: true, timeout: 15000});
    };
    const pf = document.getElementById('ph1');
    document.getElementById('phb').onclick = () => pf.click();
    pf.onchange = () => {
      const file = pf.files && pf.files[0]; if (!file) return;
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => { const k = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        photo = c.toDataURL('image/jpeg', 0.6); if (photo.length > 550000) photo = c.toDataURL('image/jpeg', 0.4); URL.revokeObjectURL(url);
        document.getElementById('phb').innerHTML = `<img src="${photo}" alt="Photo added">`; };
      img.src = url;
    };
    f.onsubmit = e => {
      e.preventDefault();
      const v = id => document.getElementById(id).value.trim(), er = document.getElementById('er');
      const say = t => { er.textContent = t; er.style.display = 'block'; };
      const digits = v('ph').replace(/\D/g, '');
      if (digits.length < 8) return say('Please enter your mobile number.');
      if (!v('ar')) return say('Please choose your area.');
      if (!v('mc')) return say('Please choose the machine.');
      if (!v('pr')) return say('Please tell us the problem.');
      if (other && !v('othT')) return say('Please tell us when you are available.');
      if (!slot && !other) return say('Please choose a time, or request another time.');
      er.style.display = 'none';
      const go = document.getElementById('go'); go.disabled = true; go.textContent = 'Sending…';
      const rec = {cid, status: 'new', name: v('nm'), phone: v('ph'), area: v('ar'), building: v('bd'), street: v('st'), zone: v('zn'), maps: loc,
        machine: v('mc'), brand: v('br'), problem: v('pr'), date: other ? '' : day, time: other ? 'Other: ' + v('othT') : slot, photo, created: Date.now()};
      fs.collection('bookings').add(rec).then(() => {
        const d = new Date(day + 'T00:00:00'), co = cfg.co || {};
        m.innerHTML = `<div class="done"><div class="big">✓</div><h2>Request received</h2><p>${other ? 'Preferred time: ' + esc(v('othT')) : esc(d.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'})) + ' · ' + rngTxt(+slot.slice(0, 2))}<br>${esc(rec.machine)} – ${esc(rec.problem)}</p>
          <p class="note" style="font-size:14px">We'll confirm on WhatsApp shortly.${co.phone ? `<br>Questions? Call <a href="tel:${esc(co.phone)}">${esc(co.phone)}</a>` : ''}</p></div>`;
        window.scrollTo(0, 0);
      }).catch(err => { go.disabled = false; go.textContent = 'Book visit'; say('Could not send – please check your internet and try again. (' + (err && (err.code || err.message)) + ')'); });
    };
  }
})();
</script>
</body>
</html>
